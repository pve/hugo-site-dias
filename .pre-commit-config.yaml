repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged secrets)
        entry: gitleaks git --staged --redact --verbose --no-banner
        language: system
        pass_filenames: false
      - id: check-internal-links
        name: internal book links resolve
        entry: python3 scripts/check-internal-links.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-front-matter
        name: front matter parses (hugo list all)
        entry: sh scripts/check-front-matter.sh
        language: system
        pass_filenames: false
        always_run: true
